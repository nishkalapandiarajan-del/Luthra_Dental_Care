
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>{% block title %}Luthra Dental Care{% endblock %}</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='css/style.css') }}">

    <!-- WEBSITE FAVICON -->
<link rel="icon"
      type="image/jpeg"
      href="{{ url_for('static', filename='images/logo.jpeg') }}">

<link rel="apple-touch-icon"
      href="{{ url_for('static', filename='images/logo.jpeg') }}">
</head>

<body>

    <header class="site-header">
        <div class="container navbar">

            <a href="{{ url_for('home') }}" class="logo">
                <img src="{{ url_for('static', filename='images/logo.jpeg') }}"
                     alt="Luthra Dental Care Logo">
            </a>

            <button class="menu-toggle" id="menuToggle"
                    aria-label="Toggle navigation">
                ☰
            </button>

            <nav class="nav-links" id="navLinks">
                <a href="{{ url_for('home') }}">Home</a>
                <a href="{{ url_for('about') }}">About</a>
                <a href="{{ url_for('services') }}">Services</a>
                <a href="{{ url_for('contact') }}">Contact</a>
                <a href="{{ url_for('appointment') }}" class="nav-button">
                    Book Appointment
                </a>
            </nav>

        </div>
    </header>

    <main>
        {% block content %}
        {% endblock %}
    </main>

    <!-- FOOTER -->
        <script>
        document.getElementById("year").textContent = new Date().getFullYear();
    </script>

    
<!-- FLOATING WHATSAPP BUTTON -->
<a href="https://wa.me/918270050287?text=Hello%20Luthra%20Dental%20Care%2C%20I%20would%20like%20to%20book%20an%20appointment.%20Kindly%20let%20me%20know%20the%20available%20timings.%20Thank%20you."
   class="whatsapp-float"
   target="_blank"
   rel="noopener noreferrer"
   aria-label="Chat with Luthra Dental Care on WhatsApp"
   title="Chat with us on WhatsApp">

    <img src="https://cdn.simpleicons.org/whatsapp/FFFFFF"
         alt="WhatsApp">
</a>
    <script src="{{ url_for('static', filename='js/script.js') }}"></script>

</body>
</html>
